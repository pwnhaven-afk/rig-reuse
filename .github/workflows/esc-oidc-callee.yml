name: esc-oidc-callee
on: workflow_call
permissions:
  contents: read
  id-token: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe OIDC availability
        run: |
          echo "ID_TOKEN_URL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            R=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=esc-test")
            echo "OIDC_RESPONSE=${R:0:120}"
          else
            echo "OIDC_ABSENT"
          fi
